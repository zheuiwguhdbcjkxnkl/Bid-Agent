[project]
name = "bid-agent-ai-backend"
version = "0.1.0"
description = "bid-agent-ai 后端工程基座"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic",
  "argon2-cffi",
  "fastapi",
  "httpx",
  "psycopg[binary,pool]",
  "python-multipart",
  "pydantic-settings",
  "redis",
  "sqlalchemy[asyncio]",
  "uvicorn[standard]",
  "celery[redis]>=5.5,<5.6",
  "mcp==2.1.0",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "minio==7.2.20",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "types-openpyxl>=3.1,<4",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.uv]
package = false
